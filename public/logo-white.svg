<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Background Circle (Dark Grey/Navy Tint) -->
  <circle cx="50" cy="50" r="50" fill="#1e293b" />

  <!-- Logo Group -->
  <!-- Using a simple scale from center: translate(15, 15) scale(0.7) is approx centering for 100x100 if origin was 0,0, but explicit center scaling is safer -->
  <g transform="translate(50 50) scale(0.65) translate(-50 -50)" stroke="#FFFFFF" stroke-width="10" stroke-linecap="square">
    <!-- Outer C -->
    <path d="M 85 28 A 42 42 0 1 0 85 72" />
    <!-- Inner Square -->
    <rect x="32" y="32" width="36" height="36" stroke-width="8" />
    <!-- Center Line -->
    <line x1="50" y1="50" x2="92" y2="50" stroke-width="8" />
    <!-- Center Dot (Filled) -->
    <circle cx="50" cy="50" r="8" fill="#FFFFFF" stroke="none" />
  </g>
</svg>
